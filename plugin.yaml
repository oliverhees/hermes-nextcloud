name: hermes-nextcloud
manifest_version: 1
version: 0.1.0
description: >
  Nextcloud-Dashboard fuer Hermes Desktop: Kalender, Aufgaben und weitere
  Nextcloud-Bereiche als Panes direkt im Hermes-Fenster. Bringt einen
  optionalen ADHS-Fokus-Modus mit (Brain-Dump-Erfassung, genau eine naechste
  Aufgabe statt einer Liste, Gamification) - abschaltbar, wenn der reine
  Ueberblick reicht.
author: Oliver Hees
homepage: https://github.com/oliverhees/hermes-nextcloud
